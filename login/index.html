<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loogin web erry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <div class="logo-square"></div>
                </div>
                <h2>Sign In</h2>
                <p>Masukkan Identitas Anda</p>
            </div>
            
    <form id="loginForm">
    <h3>Silahkan Login</h3>
<label for="username">Nama Pengguna</label>
<input type="text" id="username" placeholder "Nama Pengguna.." required="required">
<label for="password">Password</label>
<input type="password" id="password" placeholder="Password.." required="required">

<!-- <p id="message"></p> -->

<button type="submit" >masuk</button>
<div class="social">
<div class="go"> <a href="register.html">DAFTAR </a></div>
<div class="kanan"><i class="fab fa-google"></i> Google</div>
    
               <div class="form-options">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember" class="checkbox-label">
                            <div class="checkbox-box"></div>
                            <span>Remember me</span>
                        </label>
                    </div>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

               

<div id="alertBox" class="alert" style="display:none;"></div>
<button onclick="location.href='../index.html';">Home</button>
<div id="alertBox" class="alert" style="display:none;"></div>
</form>
 <script src="js/login.js"></script>
</body>
</html>

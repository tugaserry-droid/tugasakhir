<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loogin web erry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <div class="logo-square"></div>
                </div>
                <h2>Sign In</h2>
                <p>Masukkan Identitas Anda</p>
            </div>
            
    <form id="loginForm">
    <h3>Silahkan Login</h3>
<label for="username">Nama Pengguna</label>
<input type="text" id="username" placeholder "Nama Pengguna.." required="required">
<label for="password">Password</label>
<input type="password" id="password" placeholder="Password.." required="required">

<!-- <p id="message"></p> -->

<button type="submit" >masuk</button>
<div class="social">
<div class="go"> <a href="register.html">DAFTAR </a></div>
<div class="kanan"><i class="fab fa-google"></i> Google</div>
    
               <div class="form-options">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember" class="checkbox-label">
                            <div class="checkbox-box"></div>
                            <span>Remember me</span>
                        </label>
                    </div>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <span class="btn-text">MASUK</span>
                    <div class="btn-loader">
                        <div class="loader-bar"></div>
                        <div class="loader-bar"></div>
                        <div class="loader-bar"></div>
                    </div>
                </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="social-login">
                <button type="button" class="social-btn">
                    <span class="social-text">GOOGLE</span>
                </button>
                <button type="button" class="social-btn">
                    <span class="social-text">TWITER</span>
                </button>
            </div>

            <div class="signup-link">
                <span>Belum Punya Akun? </span>
                <a href="#">Membuat akun</a>
            </div>
  
            <div class="success-message" id="successMessage">
                <div class="success-icon">✓</div>
                <h3>Success</h3>
                <p>Redirecting...</p>
            </div>
        </div>
    </div>

    <script src="../../shared/js/form-utils.js"></script>
    <script src="script.js"></script>

<div id="alertBox" class="alert" style="display:none;"></div>
<button onclick="location.href='../index.html';">Home</button>
<div id="alertBox" class="alert" style="display:none;"></div>
</form>
 <script src="js/login.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
